# dsh-tree-view mounts exactly one loader row. The id is `tree-view`, which is
# distinct from both upstream spellings already in the wild — Moeblack's
# `message-edit` and SpookySandwich's `message-tree` — so our fork can be
# installed side by side with either while a migration is in flight. `name` is
# the package to import, so it follows the package rename.
#
# Compatibility anchor that deliberately does NOT follow the rename: the durable
# event type stays `message-tree/version`, so every session already branched by
# the upstream plugin keeps reading in this fork (see lib/index.js).
- insert:
    - id: tree-view
      name: dsh-tree-view
