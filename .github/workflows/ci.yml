name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:package
      - name: Ensure checks did not modify tracked files
        run: git diff --exit-code

  official-host:
    name: DSH 0.1.5-rc.2 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # dsh-llm and sharp are deliberately NOT named here: as direct dependencies their peers
      # would have to be reconciled at the runtime root, and @deepseek-ai/dsh-llm pinning
      # @deepseek-ai/cordis@4.0.2 against cordis-plugin-include's ~4.0.4 is an ERESOLVE. The
      # fixture resolves them through the tree the host itself uses instead.
      - name: Install published official runtime
        run: npm install --prefix "${{ runner.temp }}/dsh-runtime" --no-audit --no-fund @deepseek-ai/dsh@0.1.5-rc.2
      - name: Verify real edits and restart persistence with an offline model
        run: node scripts/run-dsh-acceptance.mjs
        env:
          DSH_QA_MODULES: ${{ runner.temp }}/dsh-runtime/node_modules
