name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:package
      - name: Ensure checks did not modify tracked files
        run: git diff --exit-code

  official-host:
    name: DSH ${{ matrix.dsh }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Every host line the plugin claims to support is acceptance-tested, so a
        # host that moves an API it depends on shows up here rather than in a
        # user's panel. 0.1.7 moved session navigation off the session service;
        # 0.2.0-rc.1 keeps that shape, and its workspace archive API is what the
        # tree's collect and unarchive go through.
        # 0.2.1-rc.2 is the runtime this plugin's own workstation runs, so a
        # release is checked against it here rather than after a user reports it.
        # 0.2.2-rc.1 is the line a touchscreen bug was reported against; it also
        # declares `engines.node >=24.9`, which is why the node version below is
        # picked per line instead of pinned to one value.
        dsh: ['0.1.5-rc.2', '0.1.7-rc.1', '0.2.0-rc.1', '0.2.1-rc.2', '0.2.2-rc.1']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 0.2.2-rc.1 refuses to run below Node 24.9; every earlier line is kept
          # on 22 so a regression that only shows on the older runtime is caught.
          node-version: ${{ matrix.dsh == '0.2.2-rc.1' && 24 || 22 }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # dsh-llm and sharp are deliberately NOT named here: as direct dependencies their peers
      # would have to be reconciled at the runtime root, and @deepseek-ai/dsh-llm pinning
      # @deepseek-ai/cordis@4.0.2 against cordis-plugin-include's ~4.0.4 is an ERESOLVE. The
      # fixture resolves them through the tree the host itself uses instead.
      - name: Install published official runtime
        run: npm install --prefix "${{ runner.temp }}/dsh-runtime" --no-audit --no-fund @deepseek-ai/dsh@${{ matrix.dsh }}
      - name: Verify real edits and restart persistence with an offline model
        run: node scripts/run-dsh-acceptance.mjs
        env:
          DSH_QA_MODULES: ${{ runner.temp }}/dsh-runtime/node_modules
